<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo de Entregas - Ação Social</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between p-6">
    <div class="max-w-md w-full mx-auto space-y-6">
        
        <!-- CABEÇALHO -->
        <div class="text-center space-y-1">
            <h1 class="text-xl font-bold text-slate-800">Registo de Entregas</h1>
            <p class="text-xs text-slate-500">Confirmação de entrega de cestas e relatórios</p>
        </div>

        <!-- FORMULÁRIO DE ENTREGA -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80 space-y-4">
            <h2 class="text-sm font-bold text-slate-800">Nova Entrega</h2>
            <form id="form-entrega" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Selecione a Família</label>
                    <select id="select-familia" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                        <option value="">A carregar famílias...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Observação (Opcional)</label>
                    <input type="text" id="observacao" placeholder="Ex: Cesta especial de Natal" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition shadow-sm">
                    Confirmar Entrega e Baixa
                </button>
            </form>
        </div>

        <!-- RELATÓRIOS (PDF / EXCEL) -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80 space-y-3">
            <h2 class="text-sm font-bold text-slate-800">Exportar Relatórios</h2>
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-exportar-pdf" class="py-2.5 bg-red-50 hover:bg-red-100 text-red-600 font-semibold rounded-xl text-xs transition border border-red-200">
                    📄 Baixar PDF
                </button>
                <button id="btn-exportar-excel" class="py-2.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 font-semibold rounded-xl text-xs transition border border-emerald-200">
                    📊 Baixar Excel
                </button>
            </div>
        </div>

        <!-- HISTÓRICO RECENTE -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80 space-y-3">
            <h2 class="text-sm font-bold text-slate-800">Últimas Entregas Registadas</h2>
            <ul id="lista-entregues-mes" class="divide-y divide-slate-100 max-h-50 overflow-y-auto">
                <!-- Preenchido via app.js -->
            </ul>
        </div>

        <!-- VOLTAR AO MENU -->
        <div class="text-center pt-2">
            <a href="menu.html" class="text-xs font-medium text-slate-500 hover:text-slate-900 transition underline underline-offset-4">← Voltar ao Menu Principal</a>
        </div>

    </div>

    <!-- Dependências Externas para PDF e Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- SweetAlert2, Supabase e Lógica -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js?v=2"></script>
</body>
</html>
