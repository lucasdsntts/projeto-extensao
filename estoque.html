<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlo de Estoque - Ação Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between p-6">
    <div class="max-w-md w-full mx-auto space-y-6">
        
        <!-- CABEÇALHO -->
        <div class="text-center space-y-1">
            <h1 class="text-xl font-bold text-slate-800">Controlo de Estoque</h1>
            <p class="text-xs text-slate-500">Gestão de Cestas Básicas disponíveis</p>
        </div>

        <!-- CARD DE QUANTIDADE ATUAL -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80 text-center space-y-2">
            <span class="text-xs font-medium text-slate-400 uppercase tracking-wider block">Cestas em Estoque</span>
            <span id="qtd-estoque" class="text-4xl font-extrabold text-blue-600 block">--</span>
        </div>

        <!-- FORMULÁRIO DE ATUALIZAÇÃO -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80 space-y-4">
            <h2 class="text-sm font-bold text-slate-800">Atualizar Quantidade</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nova Quantidade Total</label>
                    <input type="number" id="input-nova-qtd" placeholder="Ex: 50" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                </div>
                <button id="btn-atualizar-estoque" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition shadow-sm">
                    Atualizar Estoque
                </button>
            </div>
        </div>

        <!-- VOLTAR AO MENU -->
        <div class="text-center pt-2">
            <a href="index.html" class="text-xs font-medium text-slate-500 hover:text-slate-900 transition underline underline-offset-4">← Voltar ao Menu Principal</a>
        </div>

    </div>

    <!-- Dependências e Lógica -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js?v=4"></script>
</body>
</html>
